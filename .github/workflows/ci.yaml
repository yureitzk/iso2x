name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate -> ../target

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.22.0

      - name: Install wasm-bindgen-cli
        run: |
          WASM_BINDGEN_VERSION=$(cargo pkgid --manifest-path crate/Cargo.toml wasm-bindgen | sed 's/.*@//')
          cargo binstall wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --no-confirm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/package-lock.json

      - name: Install wasm-opt (binaryen)
        run: npm install -g binaryen@130.0.0

      - name: Install npm dependencies
        working-directory: npm
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('npm/package-lock.json') }}

      - name: Install Playwright browser + OS deps (Chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: npm
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: npm
        run: npx playwright install-deps chromium

      - name: Build (cargo + wasm-bindgen + wasm-opt + tsc)
        run: ./build.sh

      - name: Run tests
        working-directory: npm
        run: npm test

      - name: Type check
        working-directory: npm
        run: npm run type-check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate -> ../target

      - name: Check crate builds on declared MSRV
        run: cargo check --locked --manifest-path crate/Cargo.toml --target wasm32-unknown-unknown

  build-fuzzers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate/fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --vers '=0.13.2' --locked

      - name: Check fuzz targets still build
        working-directory: crate
        run: cargo fuzz check
