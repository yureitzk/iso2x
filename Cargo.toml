[workspace]
members = ["crate"]
resolver = "3"

[workspace.package]
rust-version = "1.88.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
strip = true
panic = "abort"

[profile.release-debug]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
debug = 2
strip = false
overflow-checks = true
